[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repr-lab"
version = "0.1.0"
description = "A lightweight framework for representation learning experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{name = "repr-lab Maintainers"}]
dependencies = [
    "numpy>=2.0",
]

[project.scripts]
repr-lab = "repr_lab.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
strict_optional = true
